# Get the current user's favorite artists (paginated).

query GetFavoriteArtists($first: Int = 50, $after: String) {
  me {
    userFavorites {
      artists(first: $first, after: $after) {
        edges {
          cursor
          favoritedAt
          node {
            ...ArtistFields
            # newest releases first; 25 keeps a page of 50 artists at about 6,250 of the 25,000 complexity limit
            albums(first: 25, order: RELEASE_DATE) {
              edges {
                node {
                  id
                }
              }
            }
          }
        }
        pageInfo {
          ...PageInfoFields
        }
      }
    }
  }
}
